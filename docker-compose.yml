# Локальная инфраструктура для разработки.
#
#   docker compose up -d                 — PostgreSQL, Redis, RabbitMQ, S3, Seq
#   docker compose --profile ad up -d    — то же плюс тестовый AD (Samba)
#
# Переменные берутся из .env (скопируйте .env.example).
# Сервисы Relayo запускаются из IDE и подключаются к контейнерам через localhost.

name: ${COMPOSE_PROJECT_NAME:-relayo}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Создаёт отдельного пользователя RabbitMQ для публичного сервиса.
  # Права пока на весь vhost; сузим до очередей публичного сервиса,
  # когда они появятся.
  rabbitmq-init:
    image: curlimages/curl:latest
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ADMIN: ${RABBITMQ_USER}:${RABBITMQ_PASSWORD}
      VHOST: ${RABBITMQ_VHOST}
      PUBLIC_USER: ${RABBITMQ_PUBLIC_USER}
      PUBLIC_PASSWORD: ${RABBITMQ_PUBLIC_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        api=http://rabbitmq:15672/api
        curl -sf -u "$$ADMIN" -X PUT -H 'content-type: application/json' \
          -d "{\"password\":\"$$PUBLIC_PASSWORD\",\"tags\":\"\"}" "$$api/users/$$PUBLIC_USER"
        curl -sf -u "$$ADMIN" -X PUT -H 'content-type: application/json' \
          -d '{"configure":".*","write":".*","read":".*"}' "$$api/permissions/$$VHOST/$$PUBLIC_USER"
        echo "RabbitMQ user $$PUBLIC_USER ready"
    restart: "no"

  # S3-совместимое хранилище вместо MinIO: свежих образов MinIO
  # в публичных реестрах больше нет. Relayo работает с хранилищем
  # по S3 API, поэтому боевой MinIO подключается без изменений в коде.
  s3:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - s3-data:/data

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_FIRSTRUN_ADMIN_PASSWORD}
    ports:
      - "5341:5341"
      - "${SEQ_UI_PORT}:80"
    volumes:
      - seq-data:/data

  # Тестовый Active Directory. Запускается только с профилем "ad".
  # Пользователей и папку Support создаёт скрипт:
  #   docker compose exec samba sh /seed/seed.sh
  samba:
    image: diegogslomp/samba-ad-dc:latest
    restart: unless-stopped
    profiles: ["ad"]
    privileged: true
    hostname: dc1
    environment:
      REALM: ${TEST_AD_REALM}
      DOMAIN: ${TEST_AD_DOMAIN}
      ADMIN_PASS: ${TEST_AD_ADMIN_PASSWORD}
      DNS_FORWARDER: 8.8.8.8
      BIND_NETWORK_INTERFACES: "false"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - samba-etc:/usr/local/samba/etc
      - samba-private:/usr/local/samba/private
      - samba-var:/usr/local/samba/var
      - ./tools/test-ad:/seed:ro

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  s3-data:
  seq-data:
  samba-etc:
  samba-private:
  samba-var:
