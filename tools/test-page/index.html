<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relayo · Live Server test page</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1f1f1f; }
  input, button { padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; }
  button { cursor: pointer; background: #fff; }
  code { background: #f5f5f5; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Relayo · simple test page</h1>
  <p>
    Open this file with VS Code <b>Live Server</b> (http://127.0.0.1:5500 or http://localhost:5500).
    It uses the test widget in <b>direct clientId</b> mode: <code>Relayo.setClientId()</code>.
    For the signed token mode use the test site: <a href="http://localhost:5300">http://localhost:5300</a>.
  </p>
  <p>
    <input id="clientId" placeholder="clientId, e.g. 1001">
    <button id="setClient">Relayo.setClientId()</button>
    <button onclick="Relayo.logout()">Relayo.logout()</button>
    <button onclick="Relayo.open()">Relayo.open()</button>
  </p>

  <!-- Код вставки виджета: одна строка -->
  <script async src="http://localhost:9000/relayo-widgets/widget_testdirect.js"></script>

  <script>
    // Методы Relayo.* появляются после загрузки виджета (событие relayo:ready).
    window.addEventListener('relayo:ready', function () { Relayo.setProduct('test'); }, { once: true });
    document.getElementById('setClient').onclick = function () {
      var id = document.getElementById('clientId').value.trim();
      if (id) Relayo.setClientId(id);
    };
  </script>
</body>
</html>
